<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Costs · DTM Studienassistent</title>
  <link rel="stylesheet" href="/static/styles.css">
  <style>
    body { background: var(--bg); color: var(--text); }
    .costs { max-width: 960px; margin: 0 auto; padding: 24px 16px 48px; }
    .costs-head { display: flex; flex-wrap: wrap; gap: 12px; align-items: baseline; justify-content: space-between; }
    .costs-head h1 { font-size: 1.3rem; margin: 0; }
    .ranges { display: flex; flex-wrap: wrap; gap: 6px; }
    .ranges .btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
    .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin: 20px 0 8px; }
    .tile { border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); padding: 14px 16px; }
    .tile .label { color: var(--muted); font-size: .85rem; }
    .tile .value { font-size: 1.6rem; font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 4px; }
    .tile.lead { border-color: var(--accent); }
    .note { color: var(--muted); font-size: .85rem; margin-top: 12px; }
    .warn { color: var(--danger); }
    .error { color: var(--danger); margin-top: 16px; }
  </style>
</head>
<body>
  <main class="costs">
    <div class="costs-head">
      <h1>Costs per student question</h1>
      <div class="ranges" role="group" aria-label="Range">
        <button class="btn" type="button" data-range="today">Today</button>
        <button class="btn" type="button" data-range="7d">7 days</button>
        <button class="btn" type="button" data-range="30d">30 days</button>
        <button class="btn" type="button" data-range="all">All</button>
      </div>
    </div>
    <section class="tiles" aria-live="polite">
      <div class="tile lead"><div class="label">Mean per question</div><div class="value" id="mean">–</div></div>
      <div class="tile"><div class="label">Median per question</div><div class="value" id="median">–</div></div>
      <div class="tile"><div class="label">p95 per question</div><div class="value" id="p95">–</div></div>
      <div class="tile"><div class="label">Spend</div><div class="value" id="spend">–</div></div>
      <div class="tile"><div class="label">Questions</div><div class="value" id="questions">–</div></div>
    </section>
    <p class="note warn" id="unknown" hidden></p>
    <p class="note" id="pricing"></p>
    <p class="error" id="error" role="alert" hidden></p>
  </main>
  <script src="/static/admin.js"></script>
</body>
</html>
